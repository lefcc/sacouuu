<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;">
  <title>Relatório — Sacou</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Baloo Tamma 2', sans-serif;
      background: #f7f6fb;
      color: #1e1740;
      padding: 40px;
    }

    /* Cabeçalho */
    .rel-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 36px;
      padding-bottom: 20px;
      border-bottom: 2px solid #ece8f5;
    }
    .rel-header img { height: 48px; }
    .rel-title  { font-size: 22px; font-weight: 800; color: #3d3068; }
    .rel-sub    { font-size: 12px; color: #9080b8; margin-top: 2px; }
    .rel-date   { margin-left: auto; font-size: 11px; color: #aaa; }

    /* Cards de métricas */
    .metrics { display: flex; gap: 16px; margin-bottom: 36px; }
    .m-card {
      flex: 1;
      background: #fff;
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 1px 6px rgba(95,76,154,0.10);
    }
    .m-label { font-size: 11px; color: #9080b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .m-value { font-size: 28px; font-weight: 800; color: #3d3068; margin-top: 4px; }

    /* Seções */
    .section-title {
      font-size: 15px; font-weight: 700; color: #3d3068;
      margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title::after {
      content: ''; flex: 1; height: 1px; background: #ece8f5;
    }

    /* Tabela */
    .rel-table {
      width: 100%; border-collapse: collapse;
      background: #fff; border-radius: 10px; overflow: hidden;
      box-shadow: 0 1px 4px rgba(95,76,154,0.08);
      margin-bottom: 32px;
    }
    .rel-table th {
      background: #5f4c9a; color: #fff;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
      padding: 10px 14px; text-align: left;
    }
    .rel-table td {
      padding: 10px 14px; font-size: 13px;
      border-bottom: 1px solid #ece8f5;
    }
    .rel-table tr:last-child td { border-bottom: none; }
    .rel-table tr:hover td { background: #faf9fd; }

    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
    }
    .badge.active   { background: #edfae6; color: #3a7a2a; }
    .badge.inactive { background: #fdf0f2; color: #a03040; }

    .level-tag {
      display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px;
    }
    .easy { background: #edfae6; color: #3a7a2a; }
    .med  { background: #fff3dc; color: #a06010; }
    .hard { background: #fdf0f2; color: #a03040; }

    /* Botão imprimir */
    .toolbar {
      display: flex; justify-content: flex-end; margin-bottom: 24px; gap: 10px;
    }
    .btn {
      padding: 9px 20px; border-radius: 8px; border: none;
      font-family: 'Baloo Tamma 2', sans-serif;
      font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.15s;
    }
    .btn-print  { background: #5f4c9a; color: #fff; }
    .btn-print:hover  { background: #4a3a7a; }
    .btn-close  { background: #ece8f5; color: #3d3068; }
    .btn-close:hover  { background: #ddd8f0; }

    /* Rodapé */
    .rel-footer {
      text-align: center; font-size: 11px; color: #bbb; margin-top: 20px;
    }

    @media print {
      .toolbar { display: none; }
      body { padding: 20px; background: #fff; }
    }
  </style>
</head>
<body>

  <!-- Toolbar: imprimir / fechar -->
  <div class="toolbar">
    <button class="btn btn-close" id="btn-close">✕ Fechar</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ Imprimir / PDF</button>
  </div>

  <!-- Cabeçalho do relatório -->
  <div class="rel-header">
    <span style="font-family:'Baloo Tamma 2',sans-serif;font-weight:700;font-size:26px;color:#5f4c99;display:inline-block">Sacou</span>
    <div>
      <div class="rel-title">Relatório Geral</div>
      <div class="rel-sub">Painel Administrativo — Sacou Educação Financeira</div>
    </div>
    <div class="rel-date" id="rel-date"></div>
  </div>

  <!-- Cards de métricas -->
  <div class="metrics" id="metrics"></div>

  <!-- Tabela de escolas -->
  <div class="section-title">🏫 Escolas Cadastradas</div>
  <table class="rel-table">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Código</th>
        <th>Alunos</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="schools-tbody"></tbody>
  </table>

  <!-- Tabela de questões -->
  <div class="section-title">📝 Banco de Questões</div>
  <table class="rel-table">
    <thead>
      <tr><th>#</th><th>Enunciado</th><th>Aula</th><th>Alternativas</th></tr>
    </thead>
    <tbody id="questions-tbody"></tbody>
  </table>

  <div class="rel-footer">
    Gerado por Sacou Painel Administrativo · Projeto Integrador II
  </div>

  <script src="utils.js"></script>
  <script>
    // Data de geração
    document.getElementById('rel-date').textContent =
      'Gerado em ' + new Date().toLocaleString('pt-BR');

    // Carrega dados via IPC e preenche o relatório
    async function loadRelatorio() {
      const [schools, questions, metrics] = await Promise.all([
        window.electronAPI.getSchools(),
        window.electronAPI.getQuestions(),
        window.electronAPI.getDashboardMetrics(),
      ]);

      // Métricas
      document.getElementById('metrics').innerHTML = `
        <div class="m-card">
          <div class="m-label">Escolas</div>
          <div class="m-value">${metrics.totalSchools}</div>
        </div>
        <div class="m-card">
          <div class="m-label">Total de Alunos</div>
          <div class="m-value">${metrics.totalStudents}</div>
        </div>
        <div class="m-card">
          <div class="m-label">Ativos (15 dias)</div>
          <div class="m-value">${metrics.activeStudents15d}</div>
        </div>
        <div class="m-card">
          <div class="m-label">Média de Acertos</div>
          <div class="m-value">${metrics.avgQuizScore}%</div>
        </div>
      `;

      // Escolas
      document.getElementById('schools-tbody').innerHTML = schools.map(s => `
        <tr>
          <td><strong>${escapeHTML(s.name)}</strong></td>
          <td style="font-family:monospace;font-size:12px;color:#9080b8">${escapeHTML(s.code)}</td>
          <td><strong>${s.students}</strong></td>
          <td><span class="badge ${s.status}">${s.status === 'active' ? 'Ativa' : 'Inativa'}</span></td>
        </tr>
      `).join('');

      // Questões (schema real da API /conteudo/perguntas: text, licao_titulo, alternativas).
      const nAlternativas = (q) => (Array.isArray(q.alternativas) ? q.alternativas.length : 0);
      document.getElementById('questions-tbody').innerHTML = questions.map((q, i) => {
        const altN = nAlternativas(q);
        return `
        <tr>
          <td style="color:#9080b8;font-size:12px">${i + 1}</td>
          <td>${escapeHTML(q.text || q.enunciado || '—')}</td>
          <td>${escapeHTML(q.licao_titulo || q.categoria || '—')}</td>
          <td>${altN ? `${altN} ${altN === 1 ? 'opção' : 'opções'}` : '—'}</td>
        </tr>`;
      }).join('');
    }

    loadRelatorio();

    document.getElementById('btn-close').addEventListener('click', () => {
      window.electronAPI.closeWindow();
    });
  </script>
</body>
</html>
